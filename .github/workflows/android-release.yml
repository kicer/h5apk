name: Build Android APK

on:
  # 手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:
    inputs:
      customer:
        description: '只打这一个客户（留空 = 打 branding/icon/ 下所有客户图标）'
        required: false
        default: ''
      version_code:
        description: 'version_code（留空 = 用 Variables / branding.properties 的值）'
        required: false
        default: ''
      version_name:
        description: 'version_name（留空 = 用 Variables / branding.properties 的值）'
        required: false
        default: ''
  # 推 tag 触发：tag 名 = 客户代号 -> 只打该客户；v1.2.3 形式 -> 打全部客户
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 决定本次构建哪些客户包
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.scan.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan build targets
        id: scan
        env:
          INPUT_CUSTOMER: ${{ github.event.inputs.customer }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: bash branding/ci-targets.sh >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        customer: ${{ fromJSON(needs.prepare.outputs.targets) }}
    # ===== 全部换皮配置项都可以在 GitHub 上配 =====
    # Settings → Secrets and variables → Actions → Variables 里新建同名 Variable 即可覆盖；
    # 未配置的项自动回退到 branding.properties（空串会被当作「未设置」）
    env:
      BRAND_APP_NAME: ${{ vars.BRAND_APP_NAME }}
      BRAND_STATUS_BAR_COLOR: ${{ vars.BRAND_STATUS_BAR_COLOR }}
      BRAND_CUSTOMER: ${{ vars.BRAND_CUSTOMER }}
      BRAND_APPLICATION_ID: ${{ vars.BRAND_APPLICATION_ID }}
      BRAND_VERSION_CODE: ${{ vars.BRAND_VERSION_CODE }}
      BRAND_VERSION_NAME: ${{ vars.BRAND_VERSION_NAME }}
      BRAND_HTTP_HOST: ${{ vars.BRAND_HTTP_HOST }}
      BRAND_HTTP_PORT: ${{ vars.BRAND_HTTP_PORT }}
      BRAND_HTTPS_HOST: ${{ vars.BRAND_HTTPS_HOST }}
      BRAND_HTTPS_PORT: ${{ vars.BRAND_HTTPS_PORT }}
      BRAND_FIXED_URL: ${{ vars.BRAND_FIXED_URL }}
      BRAND_FALLBACK_URL: ${{ vars.BRAND_FALLBACK_URL }}
      BRAND_BLOCK_EXTERNAL_SUBRESOURCES: ${{ vars.BRAND_BLOCK_EXTERNAL_SUBRESOURCES }}
      BRAND_OPEN_EXTERNAL_LINKS: ${{ vars.BRAND_OPEN_EXTERNAL_LINKS }}
      BRAND_DEEP_LINK_PAGES: ${{ vars.BRAND_DEEP_LINK_PAGES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest 镜像自带 Android SDK；不用 android-actions/setup-android
      # （它会把已废弃的 tools 包传给 sdkmanager 而失败）
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1)"
          echo "sdkmanager: ${SDKMANAGER:-未找到（交给 Gradle 自动下载）}"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      # 签名文件不进仓库：从 Secrets 还原 keystore 与 keystore.properties
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ 缺少 secret KEYSTORE_BASE64，无法签名" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 release.keystore keystore.properties

      # 仓库里默认指向腾讯镜像的 -all（国内本地已缓存，不要动）
      # CI runner 在境外：换官方源，并降为体积更小的 -bin（省 70MB）
      - name: Use official Gradle distribution
        run: |
          sed -i -e 's#mirrors\.cloud\.tencent\.com/gradle/#services.gradle.org/distributions/#g' \
                 -e 's#gradle-\([0-9][0-9.]*\)-all\.zip#gradle-\1-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Build release APK
        env:
          TARGET: ${{ matrix.customer }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "$TARGET" = "_base" ]; then
            # 显式清空 customer，强制使用基础包名
            ARGS="-Pcustomer="
          else
            ARGS="-Pcustomer=$TARGET"
          fi
          if [ -n "$INPUT_VERSION_CODE" ]; then
            ARGS="$ARGS -Pversion_code=$INPUT_VERSION_CODE"
          fi
          if [ -n "$INPUT_VERSION_NAME" ]; then
            ARGS="$ARGS -Pversion_name=$INPUT_VERSION_NAME"
          fi

          # shellcheck disable=SC2086
          ./branding/build.sh release $ARGS

          mkdir -p dist
          if [ "$TARGET" = "_base" ]; then
            OUT="agent.apk"
          else
            OUT="agent-$TARGET.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/$OUT"
          echo "产物: dist/$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: apk-${{ matrix.customer }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # 产物按客户发布到各自的 Release（tag = 客户代号），便于「按客户找包」
  # 只有该客户构建成功才会更新它的 Release；单个客户失败不影响其他客户
  # 另：若配了 DEPLOY_HOST + DEPLOY_SSH_KEY，还会把 APK 直接 scp 到自己的服务器
  release:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 配了这两个 Secret 才会执行「上传到自己服务器」那两步，否则自动跳过
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      # gh release create 需要 git 上下文解析 tag，必须 checkout
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download all APKs
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish per-customer releases
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.prepare.outputs.targets }}
        run: |
          set -euo pipefail
          ls -la dist
          echo "客户列表: $TARGETS"
          for c in $(printf '%s' "$TARGETS" | jq -r '.[]'); do
            if [ "$c" = "_base" ]; then
              tag="agent"; asset="agent.apk"
            else
              tag="$c"; asset="agent-$c.apk"
            fi
            if [ ! -f "dist/$asset" ]; then
              echo "⚠️ 跳过 $c：找不到 dist/$asset"
              continue
            fi
            ( cd dist && sha256sum "$asset" > SHA256SUMS.txt )
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "更新 Release: $tag"
              gh release upload "$tag" "dist/$asset" dist/SHA256SUMS.txt --clobber
            else
              echo "创建 Release: $tag"
              gh release create "$tag" "dist/$asset" dist/SHA256SUMS.txt \
                --title "$tag" \
                --notes "自动构建产物。SHA-256 见 SHA256SUMS.txt。"
            fi
          done

      # ===== 以下两步：把 APK 直接传到你自己的服务器（没配 Secret 自动跳过）=====
      - name: Setup SSH
        if: ${{ env.DEPLOY_HOST != '' && env.DEPLOY_SSH_KEY != '' }}
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: Deploy APKs to server
        if: ${{ env.DEPLOY_HOST != '' && env.DEPLOY_SSH_KEY != '' }}
        env:
          TARGETS: ${{ needs.prepare.outputs.targets }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_URL_BASE: ${{ vars.DEPLOY_URL_BASE }}
        run: |
          set -euo pipefail
          DEPLOY_USER="${DEPLOY_USER:-root}"
          DEPLOY_DIR="${DEPLOY_DIR:-/root/workspace/webserver/website/www/html/apk}"
          DEPLOY_URL_BASE="${DEPLOY_URL_BASE:-https://file.foresh.com/apk}"
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -o BatchMode=yes "$remote" "mkdir -p '${DEPLOY_DIR}'"
          for c in $(printf '%s' "$TARGETS" | jq -r '.[]'); do
            if [ "$c" = "_base" ]; then
              asset="agent.apk"
            else
              asset="agent-$c.apk"
            fi
            if [ ! -f "dist/$asset" ]; then
              echo "⚠️ 跳过 $c：找不到 dist/$asset"
              continue
            fi
            scp -o BatchMode=yes "dist/$asset" "${remote}:${DEPLOY_DIR}/${asset}"
            echo "✅ 已上传 ${asset} -> ${DEPLOY_URL_BASE%/}/${asset}"
          done
