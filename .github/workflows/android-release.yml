name: Build Android APK

on:
  # 手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:
    inputs:
      customer:
        description: '只打这一个客户（留空 = 打 branding/icon/ 下所有客户图标）'
        required: false
        default: ''
      version_code:
        description: 'version_code（留空 = 用 Variables / branding.properties 的值）'
        required: false
        default: ''
      version_name:
        description: 'version_name（留空 = 用 Variables / branding.properties 的值）'
        required: false
        default: ''
  # 推 v* tag 自动出包，并自动发布到 Release 供直接下载
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 决定本次构建哪些客户包
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.scan.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan build targets
        id: scan
        env:
          INPUT_CUSTOMER: ${{ github.event.inputs.customer }}
        run: bash branding/ci-targets.sh >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        customer: ${{ fromJSON(needs.prepare.outputs.targets) }}
    # ===== 全部换皮配置项都可以在 GitHub 上配 =====
    # Settings → Secrets and variables → Actions → Variables 里新建同名 Variable 即可覆盖；
    # 未配置的项自动回退到 branding.properties（空串会被当作「未设置」）
    env:
      BRAND_APP_NAME: ${{ vars.BRAND_APP_NAME }}
      BRAND_STATUS_BAR_COLOR: ${{ vars.BRAND_STATUS_BAR_COLOR }}
      BRAND_CUSTOMER: ${{ vars.BRAND_CUSTOMER }}
      BRAND_APPLICATION_ID: ${{ vars.BRAND_APPLICATION_ID }}
      BRAND_VERSION_CODE: ${{ vars.BRAND_VERSION_CODE }}
      BRAND_VERSION_NAME: ${{ vars.BRAND_VERSION_NAME }}
      BRAND_HTTP_HOST: ${{ vars.BRAND_HTTP_HOST }}
      BRAND_HTTP_PORT: ${{ vars.BRAND_HTTP_PORT }}
      BRAND_HTTPS_HOST: ${{ vars.BRAND_HTTPS_HOST }}
      BRAND_HTTPS_PORT: ${{ vars.BRAND_HTTPS_PORT }}
      BRAND_FIXED_URL: ${{ vars.BRAND_FIXED_URL }}
      BRAND_FALLBACK_URL: ${{ vars.BRAND_FALLBACK_URL }}
      BRAND_BLOCK_EXTERNAL_SUBRESOURCES: ${{ vars.BRAND_BLOCK_EXTERNAL_SUBRESOURCES }}
      BRAND_OPEN_EXTERNAL_LINKS: ${{ vars.BRAND_OPEN_EXTERNAL_LINKS }}
      BRAND_DEEP_LINK_PAGES: ${{ vars.BRAND_DEEP_LINK_PAGES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest 镜像自带 Android SDK；不用 android-actions/setup-android
      # （它会把已废弃的 tools 包传给 sdkmanager 而失败）
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1)"
          echo "sdkmanager: ${SDKMANAGER:-未找到（交给 Gradle 自动下载）}"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      # 签名文件不进仓库：从 Secrets 还原 keystore 与 keystore.properties
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ 缺少 secret KEYSTORE_BASE64，无法签名" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 release.keystore keystore.properties

      # 仓库里默认指向腾讯镜像的 -all（国内本地已缓存，不要动）
      # CI runner 在境外：换官方源，并降为体积更小的 -bin（省 70MB）
      - name: Use official Gradle distribution
        run: |
          sed -i -e 's#mirrors\.cloud\.tencent\.com/gradle/#services.gradle.org/distributions/#g' \
                 -e 's#gradle-\([0-9][0-9.]*\)-all\.zip#gradle-\1-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Build release APK
        env:
          TARGET: ${{ matrix.customer }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "$TARGET" = "_base" ]; then
            # 显式清空 customer，强制使用基础包名
            ARGS="-Pcustomer="
          else
            ARGS="-Pcustomer=$TARGET"
          fi
          if [ -n "$INPUT_VERSION_CODE" ]; then
            ARGS="$ARGS -Pversion_code=$INPUT_VERSION_CODE"
          fi
          if [ -n "$INPUT_VERSION_NAME" ]; then
            ARGS="$ARGS -Pversion_name=$INPUT_VERSION_NAME"
          fi

          # shellcheck disable=SC2086
          ./branding/build.sh release $ARGS

          mkdir -p dist
          if [ "$TARGET" = "_base" ]; then
            OUT="agent.apk"
          else
            OUT="agent-$TARGET.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/$OUT"
          echo "产物: dist/$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: apk-${{ matrix.customer }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # 推 tag 时把产物发布成 Release，可直接从 Releases 页面下载（长期保留）
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传"
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --title "$TAG" \
              --notes "自动构建产物，SHA-256 见 SHA256SUMS.txt。"
          fi
