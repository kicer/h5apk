name: Build Android APK

on:
  # 手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:
    inputs:
      customer:
        description: 'customer 代号（留空 = 用 branding.properties 里的值）'
        required: false
        default: ''
      upload:
        description: '构建后上传到服务器'
        type: boolean
        required: false
        default: false
  # 打 tag（v*）自动出包
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 用于「配了才部署」的判断；未配置这些 secret 时为空
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # 签名文件不进仓库：从 Secrets 还原 keystore 与 keystore.properties
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ 缺少 secret KEYSTORE_BASE64，无法签名" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 release.keystore keystore.properties

      - name: Build release APK
        env:
          CUSTOMER_INPUT: ${{ github.event.inputs.customer }}
        run: |
          ARGS=""
          if [ -n "$CUSTOMER_INPUT" ]; then
            ARGS="-Pcustomer=$CUSTOMER_INPUT"
          fi
          # shellcheck disable=SC2086
          ./branding/build.sh release $ARGS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 可选部署：配了 SSH_PRIVATE_KEY + DEPLOY_HOST 且勾选 upload 才会执行
      - name: Deploy to server
        if: ${{ github.event.inputs.upload == 'true' && env.SSH_PRIVATE_KEY != '' && env.DEPLOY_HOST != '' }}
        env:
          UPLOAD_TARGET: root@${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          CUSTOMER_INPUT: ${{ github.event.inputs.customer }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          ARGS=""
          if [ -n "$CUSTOMER_INPUT" ]; then
            ARGS="-Pcustomer=$CUSTOMER_INPUT"
          fi
          # 构建已缓存，这一步基本只做 scp 与打印下载地址
          # shellcheck disable=SC2086
          ./branding/build.sh release --upload $ARGS
