# ============================================
# 换皮 / 服务端地址配置：改完这里，跑 ./branding/build.sh
# 以下全部为【编译期】写死，装成 APK 后无法修改
# ============================================

# 应用名称（桌面图标下的文字）
app_name=Agent

# 顶部状态栏颜色，格式 #RRGGBB
status_bar_color=#FFFFFF

# 应用图标：把一张【正方形】png 放到 branding/icon/ic_launcher.png 即可生效；
# 删除该文件则恢复默认图标（branding/icon/default/）
# 无需在本文件配置路径，脚本自动探测

# 客户代号：留空即可。客户列表由 branding/customers/ 或 branding/icon/ 下的文件名决定，
# 不在这里配（CI 由 tag 名或 Run workflow 输入指定；本地想指定用 -Pcustomer=xxx）。
customer=

# 基础包名（不要用 com.a1 这类随机包名）
# 最终包名 = application_id + "." + 客户代号（例：com.foresh.agent.zcwx）
application_id=com.foresh.agent

# 版本号：升级覆盖安装时 version_code 必须递增
version_code=223
version_name=2.2.3

# ===== 服务端地址（编译期写死，装成 APK 后不可修改）=====
# HTTP 直连：固定 IP + 端口（network_security_config 只对该 IP 开放明文）
# 改成你自己的固定 IP
http_host=43.155.166.78
http_port=8090

# HTTPS 域名（必须是有效证书的域名，App 不做任何证书绕过）
https_host=agent.ai.foresh.com
https_port=443

# 启动地址：默认走这个地址（用户首次启动可手动填别的 origin，留空则用它）
# 必须是上面两个地址之一，写法要与 host/port 完全一致
fixed_url=https://agent.ai.foresh.com

# 备用地址（可选）：默认地址首次加载失败时自动切换一次；留空 = 不切换
# 仅在用户没有手动填地址时生效（手动填的地址不会自动切换）
fallback_url=http://43.155.166.78:8090

# 是否拦截非白名单的网页子资源（图片/CSS/JS/接口）。true = 最严。
# 若 H5 依赖第三方 CDN，把它改成 false（导航/下载/上传仍强制白名单）
block_external_subresources=false

# 网页上的外部 http(s) 链接点击后如何处理：
#   true  = 交给系统浏览器打开（普通 App 行为，链接可用）
#   false = 直接拦截，点外链无反应
# 注意：只对 http(s) 放行到浏览器，tel/mailto/intent 等其他协议一律拦截
open_external_links=true

# 深链枚举：agent://open?page=xxx 允许的页面，格式 name:path，逗号分隔。
# 禁止外部传入完整 URL，只允许这里列出的固定页面；禁止 save 之类的持久化参数
deep_link_pages=home:/,login:/login
