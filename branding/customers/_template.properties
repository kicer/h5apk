# ============================================
# 单个客户的专属配置模板（可选）
#
# 用法：复制本文件为 branding/customers/<客户代号>.properties
#   例：branding/customers/customerA.properties
#   再配套一张图标 branding/icon/customerA.png（可选，不加就用通用图标）
#
# 加载优先级（高 → 低）：
#   workflow 手动输入(-P) > BRAND_* 环境变量 > 本文件 > branding.properties > 代码默认值
#
# 只写需要覆盖的项即可，其余全部继承 branding.properties
# 文件名以 _ 开头的不会被打包（本模板就是），所以可以放心放在这里
# ============================================

# 应用名（桌面图标下的文字）
#app_name=客户A

# 顶部状态栏颜色 #RRGGBB
#status_bar_color=#FFFFFF

# 基础包名（一般不用改；最终包名 = application_id + "." + customer）
#application_id=com.foresh.agent

# 版本号（也可以统一放 branding.properties，所有客户共用）
#version_code=212
#version_name=2.1.2

# ===== 服务端地址：每个客户通常都不一样 =====
# HTTP 直连：固定 IP + 端口
#http_host=10.0.0.5
#http_port=8090

# HTTPS 域名
#https_host=a.example.com
#https_port=443

# 启动地址：必须是上面两个地址之一，host/port 写法要完全一致
#fixed_url=https://a.example.com
#fallback_url=http://10.0.0.5:8090

# 深链枚举页
#deep_link_pages=home:/,login:/login

# 其他开关（一般不用改）
#block_external_subresources=true
#open_external_links=true
